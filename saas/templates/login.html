{% block title %}Log in{% endblock %}
{% block body %}
<h1>Log in</h1>
<form method="post">
  <label>Email<input type="email" name="email" required></label>
  <label>Password<input type="password" name="password" required></label>

</form>
<p>No account yet? <a href="/signup">Sign up</a>.</p>
{% endblock %}
