<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rivalore{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; }
    a.brand { font-weight:700; font-size:1.3rem; text-decoration:none; color:inherit; }
    .plans { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; }
    .card { border:1px solid #8884; border-radius:12px; padding:1.2rem; }
    .price { font-size:1.6rem; font-weight:700; }
    button, .btn { background:#2563eb; color:#fff; border:0; border-radius:8px; padding:.6rem 1rem; font-size:1rem; cursor:pointer; text-decoration:none; display:inline-block; }
    .btn.secondary { background:#6b7280; }
    input { width:100%; padding:.6rem; margin:.3rem 0 1rem; border:1px solid #8886; border-radius:8px; box-sizing:border-box; }
    .flash { background:#fde68a; color:#000; padding:.6rem 1rem; border-radius:8px; margin-bottom:1rem; }
    table { width:100%; border-collapse:collapse; } td { padding:.4rem 0; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">🛰️ Rivalore</a>
    <nav>
      {% if account %}<a href="/dashboard">Dashboard</a> · <a href="/logout">Log out</a>
      {% else %}<a href="/login">Log in</a> · <a class="btn" href="/signup">Sign up</a>{% endif %}
    </nav>
  </header>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</body>
</html>
